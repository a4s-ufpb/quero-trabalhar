version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
    groups:
      maven-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      maven-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
