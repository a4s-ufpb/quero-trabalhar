spring:
  application:
    name: ${APP_NAME:QueroTrabalhar}

  profiles:
    # Se a variável de ambiente não existir, o perfil 'test' será ativado por padrão
    active: ${SPRING_PROFILES_ACTIVE:test}

  jpa:
    open-in-view: true

  h2:
    console:
      enabled: true
      path: /h2-console

# Configurações de Segurança JWT
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}